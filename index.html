<!DOCTYPE html>
<html lang="tr" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not Defterim</title>
<!-- Favicon / App Icon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='104' fill='%234f46e5'/><path d='M140 130h232v44H140zM140 220h232v44H140zM140 310h150v44H140z' fill='%23ffffff'/></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
darkMode: 'class',
theme: {
extend: {
colors: {
brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
}
}
}
}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">

<!-- Header -->
<header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 sticky top-0 z-20">
<div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center space-x-3">
<div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-md">
<i class="fa-solid fa-note-sticky text-xl"></i>
</div>
<h1 class="text-xl font-bold bg-gradient-to-r from-brand-600 to-indigo-500 bg-clip-text text-transparent">Not Defterim</h1>
</div>
<div class="flex items-center space-x-2">
<button onclick="toggleDarkMode()" class="p-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition" title="Tema Değiştir">
<i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
</button>
<button onclick="openModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition flex items-center space-x-2">
<i class="fa-solid fa-plus"></i>
<span>Yeni Not</span>
</button>
</div>
</div>
</header>

<!-- Main Content -->
<main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full flex flex-col">
<!-- Search and Filter Bar -->
<div class="mb-6 flex flex-col sm:flex-row gap-3">
<div class="relative flex-1">
<i class="fa-solid fa-search absolute left-3.5 top-3.5 text-gray-400"></i>
<input type="text" id="search-input" oninput="renderNotes()" placeholder="Notlarda ara..." class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 transition shadow-sm">
</div>
<div class="sm:w-48">
<select id="category-filter" onchange="renderNotes()" class="w-full px-4 py-2.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 transition shadow-sm">
<option value="">Tüm Kategoriler</option>
<option value="Kişisel">Kişisel</option>
<option value="İş">İş</option>
<option value="Alışveriş">Alışveriş</option>
<option value="Fikirler">Fikirler</option>
</select>
</div>
</div>

<!-- Notes Grid -->
<div id="notes-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

<!-- Boş Durum -->
<div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
<div class="w-20 h-20 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center text-gray-400 dark:text-gray-500 mb-4 text-3xl">
<i class="fa-solid fa-box-open"></i>
</div>
<h3 class="text-lg font-semibold text-gray-700 dark:text-gray-300">Henüz not bulunmuyor</h3>
<p class="text-sm text-gray-500 dark:text-gray-400 mt-1">"Yeni Not" butonuna tıklayarak ilk notunuzu ekleyin.</p>
</div>
</main>

<!-- Not Ekleme / Düzenleme Modalı -->
<div id="note-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
<div class="bg-white dark:bg-gray-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-gray-200 dark:border-gray-700">
<div class="flex justify-between items-center mb-4">
<h3 id="modal-title" class="text-lg font-bold">Yeni Not Ekle</h3>
<button type="button" onclick="closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"><i class="fa-solid fa-xmark text-xl"></i></button>
</div>
<form id="note-form" onsubmit="saveNote(event)">
<input type="hidden" id="note-id">
<div class="space-y-4">
<div>
<label class="block text-sm font-medium mb-1">Başlık</label>
<input type="text" id="note-title" required class="w-full px-3.5 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-sm font-medium mb-1">Kategori</label>
<select id="note-category" class="w-full px-3.5 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
<option value="Kişisel">Kişisel</option>
<option value="İş">İş</option>
<option value="Alışveriş">Alışveriş</option>
<option value="Fikirler">Fikirler</option>
</select>
</div>
<div>
<label class="block text-sm font-medium mb-1">Etiket (Örn: #proje)</label>
<input type="text" id="note-tag" placeholder="#önemli" class="w-full px-3.5 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
</div>
</div>
<div>
<label class="block text-sm font-medium mb-1">İçerik</label>
<textarea id="note-content" rows="6" required class="w-full px-3.5 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none transition"></textarea>
</div>
</div>
<div class="mt-6 flex justify-end space-x-3">
<button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition">İptal</button>
<button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-sm transition">Kaydet</button>
</div>
</form>
</div>
</div>

<!-- JavaScript Mantığı -->
<script>
let notes = JSON.parse(localStorage.getItem('notes')) || [
{ id: 1, title: 'Hoş Geldiniz!', content: 'Bu sizin ilk örnek notunuzdur. Sağ üstteki buton ile yeni not ekleyebilir, çıktısını alabilir veya düzenleyebilirsiniz.', category: 'Kişisel', tag: '#başlangıç', date: '2026-10-20' }
 ];

function init() {
const savedTheme = localStorage.getItem('theme') || 'light';
if (savedTheme === 'dark') {
document.documentElement.classList.add('dark');
document.getElementById('theme-icon').className = 'fa-solid fa-sun text-lg';
}
renderNotes();
}

function toggleDarkMode() {
const html = document.documentElement;
const icon = document.getElementById('theme-icon');
if (html.classList.contains('dark')) {
html.classList.remove('dark');
localStorage.setItem('theme', 'light');
icon.className = 'fa-solid fa-moon text-lg';
} else {
html.classList.add('dark');
localStorage.setItem('theme', 'dark');
icon.className = 'fa-solid fa-sun text-lg';
}
}

function openModal(id = null) {
const modal = document.getElementById('note-modal');
const titleEl = document.getElementById('modal-title');
const form = document.getElementById('note-form');
if (form) form.reset();
const idInput = document.getElementById('note-id');
if (idInput) idInput.value = '';

if (id) {
if (titleEl) titleEl.textContent = 'Notu Düzenle';
const note = notes.find(n => n.id === id);
if (note) {
if (idInput) idInput.value = note.id;
document.getElementById('note-title').value = note.title || '';
document.getElementById('note-category').value = note.category || 'Kişisel';
document.getElementById('note-tag').value = note.tag || '';
document.getElementById('note-content').value = note.content || '';
}
} else {
if (titleEl) titleEl.textContent = 'Yeni Not Ekle';
}
if (modal) modal.classList.remove('hidden');
}

function closeModal() {
const modal = document.getElementById('note-modal');
if (modal) modal.classList.add('hidden');
}

function saveNote(e) {
if (e) e.preventDefault();

const idVal = document.getElementById('note-id').value;
const title = document.getElementById('note-title').value;
const category = document.getElementById('note-category').value;
const tag = document.getElementById('note-tag').value;
const content = document.getElementById('note-content').value;
const date = new Date().toISOString().split('T')[0];

if (!title.trim() || !content.trim()) {
alert('Lütfen başlık ve içerik alanlarını doldurun.');
return;
}

if (idVal !== '') {
const numericId = Number(idVal);
notes = notes.map(n => n.id === numericId ? { ...n, title, category, tag, content } : n);
} else {
const newNote = { id: Date.now(), title, category, tag, content, date };
notes.unshift(newNote);
}

localStorage.setItem('notes', JSON.stringify(notes));
closeModal();
renderNotes();
}

function deleteNote(id) {
if (confirm('Bu notu silmek istediğinize emin misiniz?')) {
notes = notes.filter(n => n.id !== id);
localStorage.setItem('notes', JSON.stringify(notes));
renderNotes();
}
}

function printNote(id) {
const note = notes.find(n => n.id === id);
if (!note) return;

const printWindow = window.open('', '_blank');
if (!printWindow) {
alert('Lütfen tarayıcınızın pop-up engelleyicisini kapatın.');
return;
}

printWindow.document.write(&lt;!DOCTYPE html&gt; &lt;html lang="tr"&gt; &lt;head&gt; &lt;meta charset="UTF-8"&gt; &lt;title&gt;${escapeHtml(note.title)}</title>
<style>
body { font-family: Arial, sans-serif; padding: 30px; color: #111; max-width: 800px; margin: 0 auto; }
h2 { font-size: 24px; margin-bottom: 5px; color: #1f2937; }
.meta { font-size: 13px; color: #6b7280; margin-bottom: 20px; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
.content { font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
@media print {
body { padding: 0; }
}
</style>
</head>
<body>
<h2>${escapeHtml(note.title)}&lt;/h2&gt; &lt;div class="meta"&gt; &lt;strong&gt;Kategori:&lt;/strong&gt; ${escapeHtml(note.category)}  | 
<strong>Tarih:</strong> ${note.date} ${note.tag ? ' |  <strong>Etiket:</strong> ' + escapeHtml(note.tag) : ''}
</div>
<div class="content">${escapeHtml(note.content)}&lt;/div&gt; &lt;script&gt; window.onload = function() { window.print(); } &lt;\/script&gt; &lt;/body&gt; &lt;/html&gt;);
printWindow.document.close();
}

function renderNotes() {
const container = document.getElementById('notes-container');
const emptyState = document.getElementById('empty-state');
const searchInput = document.getElementById('search-input');
const categoryFilter = document.getElementById('category-filter');

if (!container) return;

const searchQuery = searchInput ? searchInput.value.toLowerCase() : '';
const selectedCategory = categoryFilter ? categoryFilter.value : '';

const filtered = notes.filter(n => {
const matchesSearch = (n.title && n.title.toLowerCase().includes(searchQuery)) ||
(n.content && n.content.toLowerCase().includes(searchQuery));
const matchesCategory = !selectedCategory || n.category === selectedCategory;
return matchesSearch && matchesCategory;
});

if (filtered.length === 0) {
container.innerHTML = '';
if (emptyState) {
emptyState.classList.remove('hidden');
emptyState.classList.add('flex');
}
return;
}

if (emptyState) {
emptyState.classList.remove('flex');
emptyState.classList.add('hidden');
}

container.innerHTML = filtered.map(n => &lt;div class="bg-white dark:bg-gray-800 rounded-2xl p-5 border border-gray-200 dark:border-gray-700 shadow-sm hover:shadow-md transition flex flex-col justify-between"&gt; &lt;div&gt; &lt;div class="flex justify-between items-start mb-2"&gt; &lt;span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-300"&gt;${escapeHtml(n.category)}</span>
<span class="text-xs text-gray-400">${n.date}&lt;/span&gt; &lt;/div&gt; &lt;h3 class="font-bold text-lg mb-2 text-gray-900 dark:text-white line-clamp-1"&gt;${escapeHtml(n.title)}</h3>
<p class="text-gray-600 dark:text-gray-300 text-sm mb-4 line-clamp-3 whitespace-pre-wrap">${escapeHtml(n.content)}&lt;/p&gt; &lt;/div&gt; &lt;div&gt; ${n.tag ? <span class="text-xs text-indigo-500 font-medium mb-3 inline-block"&gt;${escapeHtml(n.tag)}</span>: ''} &lt;div class="flex items-center justify-between pt-3 border-t border-gray-100 dark:border-gray-700/60"&gt; &lt;button type="button" onclick="printNote(${n.id})" class="text-gray-500 hover:text-indigo-600 dark:hover:text-indigo-400 text-sm flex items-center space-x-1.5 transition">
<i class="fa-solid fa-print"></i>
<span>Çıktı Al</span>
</button>
<div class="flex space-x-2">
<button type="button" onclick="openModal(${n.id})" class="p-1.5 text-gray-400 hover:text-blue-500 transition" title="Düzenle"&gt;&lt;i class="fa-solid fa-pen"&gt;&lt;/i&gt;&lt;/button&gt; &lt;button type="button" onclick="deleteNote(${n.id})" class="p-1.5 text-gray-400 hover:text-red-500 transition" title="Sil"&gt;&lt;i class="fa-solid fa-trash"&gt;&lt;/i&gt;&lt;/button&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt;).join('');
}

function escapeHtml(text) {
if (!text) return '';
const map = { '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' };
return text.toString().replace(/[&<>"']/g, m => map[m]);
}

window.onload = init;
</script>
</body>
</html>
