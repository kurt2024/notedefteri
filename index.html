<!DOCTYPE html>
<html lang="tr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Not Defteri & Çıktı Aracı</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Dedicated Print Stylesheet for clean output without app UI */
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-note, #printable-note * {
                visibility: visible;
            }
            #printable-note {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 2.5rem;
                background: white !important;
                color: #0f172a !important;
                box-shadow: none !important;
                border: none !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-screen flex flex-col overflow-hidden transition-colors duration-200">

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 dark:bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 text-sm border border-slate-700">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-message">İşlem başarılı!</span>
    </div>

    <!-- Main App Container -->
    <div class="flex flex-1 h-full overflow-hidden">

        <!-- Sidebar / Note Navigation -->
        <aside id="sidebar" class="w-full md:w-80 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col z-20 transition-all duration-300 absolute md:relative inset-y-0 left-0 transform -translate-x-full md:translate-x-0">
            <!-- Sidebar Header -->
            <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-100 dark:shadow-none">
                        <i class="fa-solid fa-note-sticky text-base"></i>
                    </div>
                    <h1 class="font-bold text-lg text-slate-900 dark:text-white tracking-tight">NotDefterim</h1>
                </div>
                <div class="flex items-center space-x-1">
                    <!-- Theme Toggle Button -->
                    <button onclick="toggleTheme()" title="Tema Değiştir" class="text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                        <i id="theme-icon" class="fa-solid fa-moon text-base"></i>
                    </button>
                    <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-slate-600 p-2">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Search & New Note Action -->
            <div class="p-4 space-y-3">
                <button onclick="createNewNote()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-medium py-2.5 px-4 rounded-xl shadow-lg shadow-indigo-100 dark:shadow-none flex items-center justify-center space-x-2 transition-all">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>Yeni Not Ekle</span>
                </button>

                <!-- Search Input -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search text-xs"></i>
                    </span>
                    <input type="text" id="search-input" oninput="filterNotes()" placeholder="Notlarda ara..." class="w-full pl-9 pr-4 py-2 bg-slate-100 dark:bg-slate-900 border border-transparent focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-900 rounded-xl text-sm outline-none transition-all text-slate-800 dark:text-slate-200">
                </div>

                <!-- Category Filter Chips -->
                <div class="flex items-center space-x-1.5 overflow-x-auto pb-1 text-xs">
                    <button onclick="filterByCategory('Tümü')" id="cat-btn-Tümü" class="category-chip px-3 py-1 rounded-full font-medium bg-slate-900 text-white dark:bg-slate-700 transition-all whitespace-nowrap">Tümü</button>
                    <button onclick="filterByCategory('İş')" id="cat-btn-İş" class="category-chip px-3 py-1 rounded-full font-medium bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all whitespace-nowrap">İş</button>
                    <button onclick="filterByCategory('Kişisel')" id="cat-btn-Kişisel" class="category-chip px-3 py-1 rounded-full font-medium bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all whitespace-nowrap">Kişisel</button>
                    <button onclick="filterByCategory('Fikirler')" id="cat-btn-Fikirler" class="category-chip px-3 py-1 rounded-full font-medium bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all whitespace-nowrap">Fikirler</button>
                </div>
            </div>

            <!-- Notes List -->
            <div id="notes-list" class="flex-1 overflow-y-auto px-3 space-y-1.5 pb-4">
                <!-- Populated dynamically via JS -->
            </div>

            <!-- Sidebar Footer Stats -->
            <div class="p-3 border-t border-slate-200 dark:border-slate-700 text-xs text-slate-400 flex justify-between items-center bg-slate-50 dark:bg-slate-850">
                <span id="note-count">0 not kayıtlı</span>
                <button onclick="exportAllNotesJSON()" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors flex items-center space-x-1">
                    <i class="fa-solid fa-file-arrow-down"></i>
                    <span>Yedekle</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Editor Area -->
        <main class="flex-1 flex flex-col h-full bg-white dark:bg-slate-900 overflow-hidden relative">

            <!-- Top Toolbar -->
            <header class="h-16 border-b border-slate-200 dark:border-slate-700 px-4 md:px-6 flex items-center justify-between bg-white dark:bg-slate-800 z-10 transition-colors duration-200">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleSidebar()" class="md:hidden text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <!-- Category Selector Badge -->
                    <div class="flex items-center space-x-2">
                        <label for="note-category" class="text-xs font-semibold text-slate-400 uppercase tracking-wider hidden sm:inline">Kategori:</label>
                        <select id="note-category" onchange="updateNoteCategory(this.value)" class="bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 text-xs rounded-lg px-2.5 py-1.5 font-medium outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="İş">İş</option>
                            <option value="Kişisel">Kişisel</option>
                            <option value="Fikirler">Fikirler</option>
                            <option value="Genel">Genel</option>
                        </select>
                    </div>
                </div>

                <!-- Action Toolbar Buttons -->
                <div class="flex items-center space-x-2">
                    <span id="last-saved" class="text-xs text-slate-400 hidden lg:inline mr-2">Tüm değişiklikler kaydedildi</span>
                    
                    <!-- Print Note Button -->
                    <button onclick="printCurrentNote()" title="Notu Yazdır veya PDF Olarak Kaydet" class="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-3 py-2 rounded-xl text-sm font-medium flex items-center space-x-2 transition-all">
                        <i class="fa-solid fa-print text-slate-500 dark:text-slate-400"></i>
                        <span class="hidden sm:inline">Yazdır / PDF</span>
                    </button>

                    <!-- Export Markdown / Text -->
                    <button onclick="exportSingleNote()" title="Metin Dosyası Olarak İndir" class="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-3 py-2 rounded-xl text-sm font-medium flex items-center space-x-2 transition-all">
                        <i class="fa-solid fa-download text-slate-500 dark:text-slate-400"></i>
                        <span class="hidden sm:inline">Dışa Aktar</span>
                    </button>

                    <!-- Delete Note Button -->
                    <button onclick="deleteCurrentNote()" title="Notu Sil" class="bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/50 text-rose-600 dark:text-rose-400 p-2.5 rounded-xl text-sm transition-all">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </header>

            <!-- Note Editor Canvas / Printable Wrapper -->
            <div id="printable-note" class="flex-1 overflow-y-auto p-6 md:p-12 flex flex-col max-w-4xl mx-auto w-full bg-white dark:bg-slate-900 transition-colors duration-200">
                <!-- Note Title Input -->
                <input type="text" id="note-title-input" oninput="autoSaveCurrentNote()" placeholder="Başlıksız Not..." class="text-2xl md:text-3xl font-bold text-slate-900 dark:text-white border-none outline-none placeholder:text-slate-300 dark:placeholder:text-slate-600 mb-4 bg-transparent">

                <!-- Meta Info (Visible on Print and Editor) -->
                <div class="text-xs text-slate-400 mb-6 pb-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
                    <div>
                        <span>Oluşturulma: <span id="note-created-date">-</span></span>
                        <span class="mx-2">•</span>
                        <span>Son Güncelleme: <span id="note-updated-date">-</span></span>
                    </div>
                    <div class="hidden print:block font-semibold text-slate-600">
                        NotDefterim Çıktı Servisi
                    </div>
                </div>

                <!-- Note Body Textarea -->
                <textarea id="note-body-input" oninput="autoSaveCurrentNote()" placeholder="Notunuzu buraya yazmaya başlayın..." class="flex-1 w-full resize-none border-none outline-none text-slate-700 dark:text-slate-300 leading-relaxed placeholder:text-slate-300 dark:placeholder:text-slate-600 bg-transparent font-normal text-base min-h-[400px]"></textarea>
            </div>

            <!-- Empty State Placeholder (when no notes exist) -->
            <div id="empty-state" class="absolute inset-0 bg-white dark:bg-slate-900 z-10 flex flex-col items-center justify-center text-center p-6 hidden">
                <div class="w-16 h-16 rounded-2xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-2xl mb-4 shadow-sm">
                    <i class="fa-solid fa-pen-nib"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800 dark:text-white mb-2">Seçili not bulunamadı</h2>
                <p class="text-slate-500 dark:text-slate-400 text-sm max-w-sm mb-6">Yazmaya başlamak için sol menüden bir not seçin veya yeni bir not oluşturun.</p>
                <button onclick="createNewNote()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-5 rounded-xl shadow-lg shadow-indigo-100 dark:shadow-none transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>Yeni Not Oluştur</span>
                </button>
            </div>

        </main>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // State Management
        let notes = JSON.parse(localStorage.getItem('notdefteri_notes')) || [];
        let activeNoteId = null;
        let currentFilterCategory = 'Tümü';
        let searchQuery = '';
        let currentTheme = localStorage.getItem('notdefteri_theme') || 'light';

        // DOM Elements
        const notesListEl = document.getElementById('notes-list');
        const titleInput = document.getElementById('note-title-input');
        const bodyInput = document.getElementById('note-body-input');
        const categorySelect = document.getElementById('note-category');
        const createdDateEl = document.getElementById('note-created-date');
        const updatedDateEl = document.getElementById('note-updated-date');
        const emptyStateEl = document.getElementById('empty-state');
        const noteCountEl = document.getElementById('note-count');
        const lastSavedEl = document.getElementById('last-saved');
        const searchInput = document.getElementById('search-input');
        const themeIcon = document.getElementById('theme-icon');

        // Initialize App
        function initApp() {
            // Apply saved theme
            applyTheme(currentTheme);

            if (notes.length === 0) {
                const welcomeNote = {
                    id: Date.now().toString(),
                    title: '👋 NotDefterim\'e Hoş Geldiniz',
                    body: 'NotDefterim uygulamasına hoş geldiniz!\n\nÖzellikler:\n- Notlarınızı kategorilere ayırarak düzenleyebilirsiniz (İş, Kişisel, Fikirler vb.).\n- Üst menüdeki "Yazdır / PDF" butonunu kullanarak notlarınızın çıktısını kağıda alabilir veya doğrudan PDF olarak kaydedebilirsiniz.\n- Arama çubuğu ile notlarınız içinde anında arama yapabilirsiniz.\n- Sol üstteki tema düğmesi ile Karanlık (Dark) veya Aydınlık (Light) mod arasında geçiş yapabilirsiniz.\n- Tüm verileriniz tarayıcınızın yerel depolama alanında (localStorage) güvenle saklanır.',
                    category: 'Genel',
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                notes.push(welcomeNote);
                saveToLocalStorage();
            }

            activeNoteId = notes[0].id;
            renderNotesList();
            loadActiveNoteIntoEditor();
        }

        // Theme Handling
        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('notdefteri_theme', currentTheme);
            applyTheme(currentTheme);
        }

        function applyTheme(theme) {
            const root = document.documentElement;
            if (theme === 'dark') {
                root.classList.add('dark');
                themeIcon.className = 'fa-solid fa-sun text-amber-400 text-base';
            } else {
                root.classList.remove('dark');
                themeIcon.className = 'fa-solid fa-moon text-slate-500 text-base';
            }
        }

        // Save to LocalStorage
        function saveToLocalStorage() {
            localStorage.setItem('notdefteri_notes', JSON.stringify(notes));
        }

        // Render Sidebar Notes List
        function renderNotesList() {
            notesListEl.innerHTML = '';

            let filtered = notes.filter(note => {
                const matchesCategory = currentFilterCategory === 'Tümü' || note.category === currentFilterCategory;
                const matchesSearch = note.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      note.body.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            filtered.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

            noteCountEl.textContent = `${filtered.length} not bulundu`;

            if (filtered.length === 0) {
                notesListEl.innerHTML = `
                    <div class="text-center py-8 px-4 text-slate-400 text-xs">
                        <i class="fa-solid fa-folder-open text-2xl mb-2 block"></i>
                        Filtreye uygun not bulunamadı.
                    </div>
                `;
                return;
            }

            filtered.forEach(note => {
                const isActive = note.id === activeNoteId;
                const card = document.createElement('div');
                card.onclick = () => selectNote(note.id);
                card.className = `p-3 rounded-xl cursor-pointer transition-all border ${
                    isActive 
                        ? 'bg-indigo-50/80 dark:bg-indigo-950/40 border-indigo-200 dark:border-indigo-800 shadow-sm' 
                        : 'bg-white dark:bg-slate-800 border-transparent hover:bg-slate-50 dark:hover:bg-slate-750 hover:border-slate-200 dark:hover:border-slate-700'
                }`;

                const dateStr = formatDate(note.updatedAt);
                const categoryColor = getCategoryColor(note.category);

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md ${categoryColor}">${note.category}</span>
                        <span class="text-[10px] text-slate-400">${dateStr}</span>
                    </div>
                    <h3 class="font-semibold text-sm text-slate-800 dark:text-slate-200 truncate mb-1">${escapeHTML(note.title) || 'Başlıksız Not'}</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 truncate">${escapeHTML(note.body) || 'İçerik yok...'}</p>
                `;
                notesListEl.appendChild(card);
            });
        }

        // Select Note
        function selectNote(id) {
            activeNoteId = id;
            loadActiveNoteIntoEditor();
            renderNotesList();
            
            if (window.innerWidth < 768) {
                toggleSidebar();
            }
        }

        // Load active note into editor fields
        function loadActiveNoteIntoEditor() {
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) {
                emptyStateEl.classList.remove('hidden');
                return;
            }

            emptyStateEl.classList.add('hidden');
            titleInput.value = note.title;
            bodyInput.value = note.body;
            categorySelect.value = note.category;
            createdDateEl.textContent = formatDetailedDate(note.createdAt);
            updatedDateEl.textContent = formatDetailedDate(note.updatedAt);
        }

        // Create New Note
        function createNewNote() {
            const newNote = {
                id: Date.now().toString(),
                title: '',
                body: '',
                category: currentFilterCategory === 'Tümü' ? 'Genel' : currentFilterCategory,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            notes.unshift(newNote);
            activeNoteId = newNote.id;
            saveToLocalStorage();
            renderNotesList();
            loadActiveNoteIntoEditor();
            titleInput.focus();
            showToast('Yeni not oluşturuldu');
        }

        // Auto Save Current Note on Input
        function autoSaveCurrentNote() {
            if (!activeNoteId) return;

            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;

            note.title = titleInput.value;
            note.body = bodyInput.value;
            note.updatedAt = new Date().toISOString();

            saveToLocalStorage();
            renderNotesList();

            updatedDateEl.textContent = formatDetailedDate(note.updatedAt);
            lastSavedEl.textContent = 'Tüm değişiklikler kaydedildi';
        }

        // Update Note Category
        function updateNoteCategory(category) {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;

            note.category = category;
            note.updatedAt = new Date().toISOString();
            saveToLocalStorage();
            renderNotesList();
            showToast(`Kategori güncellendi: ${category}`);
        }

        // Delete Current Note
        function deleteCurrentNote() {
            if (!activeNoteId) return;

            if (confirm('Bu notu silmek istediğinize emin misiniz?')) {
                notes = notes.filter(n => n.id !== activeNoteId);
                saveToLocalStorage();

                if (notes.length > 0) {
                    activeNoteId = notes[0].id;
                    loadActiveNoteIntoEditor();
                } else {
                    activeNoteId = null;
                    emptyStateEl.classList.add('hidden');
                    emptyStateEl.classList.remove('hidden');
                }

                renderNotesList();
                showToast('Not silindi');
            }
        }

        // Print Current Note (Triggers browser print dialog formatted via @media print)
        function printCurrentNote() {
            if (!activeNoteId) {
                showToast('Yazdırmak için lütfen bir not seçin', 'error');
                return;
            }
            window.print();
        }

        // Export Single Note as TXT file
        function exportSingleNote() {
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;

            const content = `# ${note.title}\nKategori: ${note.category}\nTarih: ${new Date(note.updatedAt).toLocaleString()}\n\n${note.body}`;
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${(note.title || 'basliksiz-not').replace(/[^a-z0-9]/gi, '_').toLowerCase()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Not metin dosyası olarak dışa aktarıldı');
        }

        // Export All Notes as JSON Backup
        function exportAllNotesJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notes, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `notdefteri_yedek_${new Date().toISOString().slice(0, 10)}.json`);
            dlAnchor.click();
            showToast('Tüm notlar başarıyla yedeklendi');
        }

        // Filter by Category
        function filterByCategory(category) {
            currentFilterCategory = category;

            document.querySelectorAll('.category-chip').forEach(btn => {
                btn.className = "category-chip px-3 py-1 rounded-full font-medium bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all whitespace-nowrap";
            });
            const activeBtn = document.getElementById(`cat-btn-${category}`);
            if (activeBtn) {
                activeBtn.className = "category-chip px-3 py-1 rounded-full font-medium bg-slate-900 text-white dark:bg-slate-700 transition-all whitespace-nowrap";
            }

            renderNotesList();
        }

        // Filter Notes via Search Input
        function filterNotes() {
            searchQuery = searchInput.value;
            renderNotesList();
        }

        // Toggle Sidebar for Mobile View
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        // Toast Notification Helper
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = message;
            if (type === 'error') {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Helper: Category Badge Styling
        function getCategoryColor(category) {
            switch(category) {
                case 'İş': return 'bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400';
                case 'Kişisel': return 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400';
                case 'Fikirler': return 'bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400';
                default: return 'bg-purple-50 dark:bg-purple-950/60 text-purple-600 dark:text-purple-400';
            }
        }

        // Helper: Date format for cards
        function formatDate(isoString) {
            const date = new Date(isoString);
            const now = new Date();
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        // Helper: Detailed Date format for header
        function formatDetailedDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('tr-TR', { dateStyle: 'medium', timeStyle: 'short' });
        }

        // Helper: Escape HTML to avoid XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        window.onload = initApp;
    </script>
</body>
</html>
